[package]
name = "sitiai"
version = "1.0.0"
description = "Siti AI — private, on-device personal assistant."
authors = ["PT Sigit Mitra Bangun <support@getsiti.5mb.app>"]
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/getsigit/siti"
homepage = "https://getsiti.5mb.app"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "sitiai_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-log = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
once_cell = "1"
tokio = { version = "1", features = ["macros", "rt"] }
# On-device LLM inference engine (Metal on Apple, CPU on Android).
# Published crate: https://crates.io/crates/onde — this is the SDK Siti showcases.
# For local SDK development, uncomment the [patch.crates-io] block at the bottom
# of this file to build against a sibling `onde` checkout instead.
onde = "1.2.2"

# Apple App Group container lookup — used to redirect the HuggingFace model
# cache into the shared `group.com.ondeinference.apps` container.
[target.'cfg(any(target_os = "ios", target_os = "macos"))'.dependencies]
objc2-foundation = { version = "0.3", features = [
    "NSFileManager",
    "NSBundle",
    "NSString",
] }

[profile.dev]
# GGUF inference is unusably slow at opt-level 0; 2 keeps dev builds bearable.
opt-level = 2
incremental = false

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "debuginfo"

# Do NOT strip proc-macro / build-script dylibs. On beta macOS (Darwin 26/27)
# `strip = "debuginfo"` corrupts their Mach-O LINKEDIT ("mis-aligned LINKEDIT
# string pool"), so rustc can't dlopen them mid-build ("can't find crate for
# thiserror_impl"). The shipped app binary stays stripped via the profile above.
[profile.release.build-override]
strip = false

# ── Local Onde SDK development ─────────────────────────────────────────────────
# Uncomment to build Siti against a local checkout of the Onde engine (sibling
# directory) instead of the published crate. Keep this commented on `main`.
#
# Enabled on this branch: the UQFF models added to Siti (Qwen 3 family) require
# onde's `load_uqff_model` API, which is not in the published `onde 1.2.2` crate
# yet. Revert to the crates.io version (or bump `onde`) once that release ships.
[patch.crates-io]
onde = { path = "../../onde" }
