name: CI

on:
  push:
    branches: [main, development]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (UI + web)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Type-check + build UI
        run: pnpm build
      - name: Build landing site
        working-directory: web
        run: pnpm build

  rust:
    name: Rust core (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      # This branch builds against Onde's main branch: `load_uqff_model` is not
      # in the published `onde` crate yet, so src-tauri/Cargo.toml patches the
      # dependency to a sibling checkout (`../../onde`). A runner has no such
      # sibling, so cargo fails to even load the manifest — clone it to the
      # path the patch expects. Cargo.lock pins the resolved graph, so
      # `cargo build --locked` still validates normally.
      #
      # Delete this step together with the [patch.crates-io] block in
      # src-tauri/Cargo.toml once onde publishes a release carrying UQFF.
      - name: Check out the Onde engine as a sibling checkout
        run: |
          git clone --depth 1 \
            --branch main \
            https://github.com/ondeinference/onde.git \
            "${{ github.workspace }}/../onde"

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      # tauri-build expects the frontend dist to exist before compiling the core.
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: rustfmt
        working-directory: src-tauri
        run: cargo fmt --all --check
      - name: clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings
      - name: build
        working-directory: src-tauri
        run: cargo build --locked
