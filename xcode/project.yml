name: SitiVision
options:
  bundleIdPrefix: ai.siti
  deploymentTarget:
    visionOS: "2.0"
  xcodeVersion: "16.0"
  generateEmptyDirectories: false
  createIntermediateGroups: false

# Ed Swift bundles the Onde inference engine, the same one the Rust side
# reaches through `ed-agent` in src-tauri/Cargo.toml.
packages:
  Ed:
    url: https://github.com/ondeinference/ed-swift
    from: 1.2.2

schemes:
  SitiVision:
    build:
      targets:
        SitiVision: all
    run:
      config: Debug
    analyze:
      config: Debug
    archive:
      config: Release
    profile:
      config: Release

targets:
  SitiVision:
    type: application
    platform: visionOS
    deploymentTarget: "2.0"
    sources:
      - path: SitiVision
        excludes:
          - build
          - project.yml
          - "*.xcodeproj"
    entitlements:
      path: SitiVision/SitiVision.entitlements
      properties:
        com.apple.developer.kernel.increased-memory-limit: true
        com.apple.security.application-groups:
          - group.com.ondeinference.apps
    dependencies:
      - package: Ed
        product: Ed
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.siti.Siti
        DEVELOPMENT_TEAM: 2TQF86ZACD
        MARKETING_VERSION: "1.0.1"
        CURRENT_PROJECT_VERSION: 1
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: "Siti AI"
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_LSApplicationCategoryType: "public.app-category.productivity"
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        SWIFT_VERSION: "6.0"
        ENABLE_USER_SCRIPT_SANDBOXING: YES
        CODE_SIGN_STYLE: Automatic
        REGISTER_APP_GROUPS: YES
        "EXCLUDED_ARCHS[sdk=xrsimulator*]": x86_64
      configs:
        # No CODE_SIGN_IDENTITY override here: with CODE_SIGN_STYLE Automatic,
        # explicitly pinning an identity conflicts with Xcode's own automatic
        # dev/distribution resolution and fails archive with "conflicting
        # provisioning settings" even though the identity matches what Xcode
        # would have picked anyway. Let Automatic signing choose it per config.
        Debug:
          SWIFT_OPTIMIZATION_LEVEL: -Onone
        Release:
          SWIFT_OPTIMIZATION_LEVEL: -O
